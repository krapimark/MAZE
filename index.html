<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFT Лабиринт — Лобби, Магазин, Скины</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(circle at 50% 0%, #2a0055 0%, #0d001a 60%, #000510 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:8px; color:#fff;
  }

  /* ====== ОБЩИЕ ЭЛЕМЕНТЫ ====== */
  .title {
    font-size:18px; font-weight:800;
    background:linear-gradient(90deg,#00ffff,#ff00ff,#ffff00);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:1px; filter:drop-shadow(0 0 8px rgba(255,0,255,0.7));
    text-align:center;
  }
  .header { text-align:center; margin-bottom:6px; flex-shrink:0; width:100%; }
  .stats { display:flex; gap:6px; justify-content:center; margin-top:4px; font-size:11px; flex-wrap:wrap; }
  .stat { background:rgba(255,255,255,0.08); padding:3px 8px; border-radius:10px; border:1px solid rgba(0,255,255,0.3); }
  .stat b { color:#00ffff; }
  .stat.hp b { color:#ff3366; }
  .stat.level b { color:#ffaa00; }
  .stat.gold b { color:#ffd700; }

  /* ====== ИГРА ====== */
  #canvasWrap {
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:14px; background:#0a0015;
    box-shadow: 0 0 25px rgba(0,255,255,0.4), 0 0 50px rgba(255,0,255,0.25);
    border:2px solid rgba(0,255,255,0.5);
    margin:4px 0; min-width:200px; min-height:200px;
  }
  #gameCanvas { display:block; background:#0a0015; border-radius:12px; }

  .controls {
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
    gap:6px; margin-top:6px; width:100%; max-width:260px; flex-shrink:0;
  }
  .btn {
    background:linear-gradient(145deg,#2a1a4a,#150a25);
    border:2px solid rgba(0,255,255,0.6); border-radius:14px;
    color:#00ffff; font-size:24px; font-weight:900; height:52px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.7), 0 0 12px rgba(0,255,255,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition:all 0.07s ease; touch-action:manipulation;
  }
  .btn:active {
    transform:translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.7), 0 0 20px rgba(255,0,255,0.9), inset 0 2px 6px rgba(255,0,255,0.5);
    border-color:#ff00ff; color:#ff00ff;
  }
  .btn.up { grid-column:2; grid-row:1; }
  .btn.left { grid-column:1; grid-row:2; }
  .btn.down { grid-column:2; grid-row:2; }
  .btn.right { grid-column:3; grid-row:2; }

  /* ====== ОВЕРЛЕЙ ====== */
  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.9);
    backdrop-filter:blur(8px); display:none;
    align-items:center; justify-content:center;
    z-index:100; padding:14px; overflow-y:auto;
  }
  .overlay.show { display:flex; }
  .modal {
    background:linear-gradient(160deg,#1a0033,#0d001a);
    border:2px solid #00ffff; border-radius:20px;
    padding:20px 18px; max-width:440px; width:100%;
    box-shadow:0 0 40px rgba(0,255,255,0.7); text-align:center;
    margin:auto;
  }
  .modal h2 {
    font-size:19px; margin-bottom:8px;
    background:linear-gradient(90deg,#00ffff,#ff00ff);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .modal p { font-size:12px; color:#aadddd; margin-bottom:12px; line-height:1.5; }

  /* ====== КНОПКИ МЕНЮ ====== */
  .menu-btn {
    display:block; width:100%;
    background:linear-gradient(135deg,#2a1a4a,#150a25);
    border:2px solid #00ffff; border-radius:14px;
    padding:14px 16px; color:#fff;
    font-size:16px; font-weight:700;
    cursor:pointer; margin-bottom:10px;
    text-align:center;
    box-shadow: 0 0 15px rgba(0,255,255,0.4);
    touch-action:manipulation;
  }
  .menu-btn:active { transform:scale(0.97); }
  .menu-btn.purple { border-color:#ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.5); }
  .menu-btn.gold { border-color:#ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.5); color:#ffe066; }
  .menu-btn.red { border-color:#ff2266; box-shadow: 0 0 15px rgba(255,34,102,0.5); }

  /* ====== ПРОФИЛЬ В ЛОББИ ====== */
  .lobby-profile {
    display:flex; align-items:center; gap:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,255,255,0.3);
    border-radius:16px; padding:12px;
    margin-bottom:14px;
  }
  .lobby-avatar {
    width:60px; height:60px; flex-shrink:0;
    border-radius:50%;
    background:#0a0015;
    border:2px solid #00ffff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 15px rgba(0,255,255,0.6);
    overflow:hidden;
    position:relative;
  }
  .lobby-avatar canvas { display:block; }
  .lobby-info { flex:1; text-align:left; }
  .lobby-info .name { font-size:12px; color:#aadddd; }
  .lobby-info .gold {
    font-size:22px; font-weight:900; color:#ffd700;
    display:flex; align-items:center; gap:6px;
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
  }
  .lobby-info .gold span { font-size:12px; color:#aaa; font-weight:400; }

  /* ====== СПИСОК УРОВНЕЙ ====== */
  .level-group { margin-bottom:12px; text-align:left; }
  .level-group-title {
    font-size:12px; font-weight:700; margin-bottom:6px;
    padding-left:2px; letter-spacing:0.5px;
  }
  .level-group-title.easy { color:#00ff88; }
  .level-group-title.medium { color:#ffaa00; }
  .level-group-title.hard { color:#ff2266; }
  .level-list { display:flex; flex-direction:column; gap:6px; }
  .level-btn {
    background:linear-gradient(135deg,#2a1a4a,#150a25);
    border:2px solid; border-radius:10px;
    padding:9px 12px; color:#fff;
    font-size:13px; font-weight:700;
    cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center;
    touch-action:manipulation;
  }
  .level-btn:active { transform:scale(0.97); }
  .level-btn.easy { border-color:#00ff88; box-shadow:0 0 8px rgba(0,255,136,0.3); }
  .level-btn.easy .tag { color:#00ff88; }
  .level-btn.medium { border-color:#ffaa00; box-shadow:0 0 8px rgba(255,170,0,0.3); }
  .level-btn.medium .tag { color:#ffaa00; }
  .level-btn.hard { border-color:#ff2266; box-shadow:0 0 8px rgba(255,34,102,0.3); }
  .level-btn.hard .tag { color:#ff2266; }
  .level-btn .tag { font-size:10px; opacity:0.9; font-weight:500; }

  /* ====== МАГАЗИН ====== */
  .shop-item {
    background:linear-gradient(135deg,#2a1a4a,#150a25);
    border:2px solid #ffd700;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    text-align:center;
    box-shadow: 0 0 15px rgba(255,215,0,0.4);
  }
  .shop-item .icon { font-size:40px; margin-bottom:6px; }
  .shop-item .name { font-size:16px; font-weight:700; color:#ffe066; margin-bottom:4px; }
  .shop-item .desc { font-size:11px; color:#aaa; margin-bottom:10px; line-height:1.4; }
  .shop-item button {
    background:linear-gradient(135deg,#ffd700,#ffaa00);
    border:none; border-radius:10px;
    padding:10px 20px; color:#1a0033;
    font-size:14px; font-weight:900;
    cursor:pointer; touch-action:manipulation;
    box-shadow: 0 4px 15px rgba(255,215,0,0.5);
  }
  .shop-item button:active { transform:scale(0.95); }
  .shop-item button:disabled {
    background:#444; color:#888;
    box-shadow:none; cursor:not-allowed;
  }

  /* ====== СКИНЫ ====== */
  .skins-grid {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px; margin-bottom:12px;
  }
  .skin-card {
    background:linear-gradient(135deg,#2a1a4a,#150a25);
    border:2px solid #333;
    border-radius:12px;
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
    position:relative;
    touch-action:manipulation;
  }
  .skin-card:active { transform:scale(0.96); }
  .skin-card.owned { border-color:#00ff88; }
  .skin-card.equipped { border-color:#ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.6); }
  .skin-card .skin-canvas {
    width:48px; height:48px; margin:0 auto 6px;
    display:block;
  }
  .skin-card .skin-name { font-size:10px; color:#ccc; font-weight:700; }
  .skin-card .skin-status { font-size:9px; margin-top:2px; color:#666; }
  .skin-card.owned .skin-status { color:#00ff88; }
  .skin-card.equipped .skin-status { color:#ffd700; }
  .skin-card.locked .skin-name { color:#555; }

  /* ====== КЕЙС / РУЛЕТКА ====== */
  .case-view {
    position:relative;
    width:100%; height:110px;
    background:linear-gradient(180deg,#0d001a,#1a0033);
    border:2px solid #ffd700;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:14px;
    box-shadow: inset 0 0 20px rgba(255,215,0,0.3);
  }
  .case-strip {
    display:flex; align-items:center;
    height:100%;
    position:absolute;
    top:0; left:0;
    will-change:transform;
  }
  .case-slot {
    width:110px; height:100%;
    flex-shrink:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:6px;
    border-right:1px dashed rgba(255,215,0,0.2);
  }
  .case-slot canvas { width:52px; height:52px; display:block; }
  .case-slot .slot-name { font-size:9px; color:#ffd700; margin-top:4px; font-weight:700; text-align:center; }
  .case-pointer {
    position:absolute; top:0; left:50%;
    width:3px; height:100%;
    background:linear-gradient(180deg,transparent,#ff2266,transparent);
    transform:translateX(-50%);
    z-index:5;
    box-shadow: 0 0 10px #ff2266;
  }
  .case-pointer::before, .case-pointer::after {
    content:'';
    position:absolute; left:50%; transform:translateX(-50%);
    border-left:8px solid transparent;
    border-right:8px solid transparent;
  }
  .case-pointer::before { top:-2px; border-top:10px solid #ff2266; }
  .case-pointer::after { bottom:-2px; border-bottom:10px solid #ff2266; }

  .case-result {
    text-align:center; padding:14px;
    background:rgba(255,215,0,0.1);
    border-radius:14px; margin-bottom:10px;
    border:2px solid #ffd700;
    animation: pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  @keyframes pop {
    from { transform:scale(0.5); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }
  .case-result canvas {
    width:80px; height:80px; display:block; margin:0 auto 8px;
  }
  .case-result .res-name { font-size:16px; font-weight:900; color:#ffd700; }
  .case-result .res-rarity { font-size:11px; margin-top:2px; }
  .case-result .res-rarity.common { color:#aaa; }
  .case-result .res-rarity.rare { color:#00ffff; }
  .case-result .res-rarity.epic { color:#ff00ff; }
  .case-result .res-rarity.legendary { color:#ffd700; }

  #damageFlash {
    position:fixed; inset:0;
    background:radial-gradient(circle, transparent 30%, rgba(255,0,0,0.6));
    opacity:0; pointer-events:none; z-index:50;
    transition:opacity 0.15s;
  }
  #damageFlash.on { opacity:1; }

  #toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
    background:linear-gradient(135deg,#1a0033,#330066);
    border:2px solid #00ffff;
    color:#fff; padding:10px 20px; border-radius:12px;
    font-size:13px; font-weight:700;
    box-shadow: 0 0 25px rgba(0,255,255,0.7);
    z-index:300; opacity:0; pointer-events:none;
    transition: all 0.3s ease;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #debug {
    position:fixed; bottom:2px; left:2px;
    color:#ff4444; font-size:9px;
    background:rgba(0,0,0,0.8); padding:2px 6px; border-radius:4px;
    display:none; z-index:200;
  }
  #debug.show { display:block; }
</style>
</head>
<body>

<div class="header">
  <div class="title">◈ NFT LABYRINTH ◈</div>
  <div class="stats">

</div>

<div id="canvasWrap">

</div>

<div id="damageFlash"></div>
<div id="toast"></div>
<div id="debug"></div>

<div class="overlay show" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

function defaultSave() {

    const data = JSON.parse(raw);
    return { ...defaultSave(), ...data };
  } catch (e) {
    return defaultSave();
  }
}

}

// ================================================================
// РИСОВАНИЕ СКИНА (шарик) — на любой canvas
// ================================================================
function drawSkinOnCanvas(cv, skinKey, size) {
  const c = cv.getContext('2d');
  const skin = SKINS[skinKey] || SKINS.blue;
  const r = size * 0.4;
  const cx = size / 2, cy = size / 2;
  c.clearRect(0, 0, size, size);
  
  // Свечение
  const glow = c.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
  glow.addColorStop(0, skin.glow);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = glow;
  c.beginPath();
  c.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
  c.fill();
  
  // Тело
  const grad = c.createRadialGradient(cx - r/3, cy - r/3, 0, cx, cy, r);
  grad.addColorStop(0, skin.colors[0]);
  grad.addColorStop(0.5, skin.colors[1]);
  grad.addColorStop(1, skin.colors[2]);
  c.fillStyle = grad;
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fill();
  
  // Глаза
  c.fillStyle = '#001a33';
  const eyeR = r * 0.18;
  c.beginPath();
  c.arc(cx - r * 0.3, cy - r * 0.1, eyeR, 0, Math.PI * 2);
  c.arc(cx + r * 0.3, cy - r * 0.1, eyeR, 0, Math.PI * 2);
  c.fill();
  
  // Блики глаз
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(cx - r * 0.25, cy - r * 0.15, eyeR * 0.4, 0, Math.PI * 2);
  c.arc(cx + r * 0.35, cy - r * 0.15, eyeR * 0.4, 0, Math.PI * 2);
  c.fill();
  
  // Улыбка
  c.strokeStyle = '#001a33';
  c.lineWidth = Math.max(1.5, r * 0.12);
  c.lineCap = 'round';
  c.beginPath();
  c.arc(cx, cy + r * 0.15, r * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
  c.stroke();
}

function pickRandomSkin() {
  // Взвешенный рандом по редкости, затем по скину этой редкости
  const byRarity = { common: [], rare: [], epic: [], legendary: [] };
  Object.keys(SKINS).forEach(k => {
    byRarity[SKINS[k].rarity].push(k);
  });
  const rarities = Object.keys(RARITY_WEIGHTS);
  let totalWeight = 0;
  rarities.forEach(r => {
    if (byRarity[r].length > 0) totalWeight += RARITY_WEIGHTS[r];
  });
  let roll = Math.random() * totalWeight;
  let pickedRarity = 'common';
  for (const r of rarities) {
    if (byRarity[r].length === 0) continue;
    if (roll < RARITY_WEIGHTS[r]) { pickedRarity = r; break; }
    roll -= RARITY_WEIGHTS[r];
  }
  const pool = byRarity[pickedRarity];
  return pool[Math.floor(Math.random() * pool.length)];
}

function openCase() {
  if (save.gold < CASE_PRICE) {
    showToast('Не хватает монет!');
    return;
  }
  save.gold -= CASE_PRICE;
  saveGame();
  
  // Список слотов для рулетки: 30 случайных + выигрыш в центре
  const allSkinKeys = Object.keys(SKINS);
  const slots = [];
  for (let i = 0; i < 40; i++) {
    slots.push(allSkinKeys[Math.floor(Math.random() * allSkinKeys.length)]);
  }
  const winSkin = pickRandomSkin();
  const winIndex = 20; // выигрыш на позиции 20
  slots[winIndex] = winSkin;
  
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h2>🎁 Открытие кейса</h2>
    <div class="case-view" id="caseView">
      <div class="case-strip" id="caseStrip"></div>
      <div class="case-pointer"></div>
    </div>
    <div id="caseResult" style="min-height:120px"></div>
    <button class="menu-btn" id="caseBackBtn" onclick="showShop()" style="display:none">◀ В магазин</button>
  `;
  
  // Заполняем полосу
  const strip = document.getElementById('caseStrip');
  const slotWidth = 110;
  slots.forEach((skinKey, i) => {
    const slot = document.createElement('div');
    slot.className = 'case-slot';
    slot.innerHTML = `
      <canvas width="52" height="52"></canvas>
      <div class="slot-name">${SKINS[skinKey].name}</div>
    `;
    strip.appendChild(slot);
    const cv = slot.querySelector('canvas');
    drawSkinOnCanvas(cv, skinKey, 52);
  });
  
  // Анимация прокрутки
  const viewWidth = document.getElementById('caseView').offsetWidth;
  const targetX = -(winIndex * slotWidth + slotWidth / 2 - viewWidth / 2);
  const startX = 0;
  const duration = 3500;
  const startTime = performance.now();
  
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  
  function animScroll(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutCubic(progress);
    const x = startX + (targetX - startX) * eased;
    strip.style.transform = `translateX(${x}px)`;
    if (progress < 1) {
      requestAnimationFrame(animScroll);
    } else {
      setTimeout(() => showCaseResult(winSkin), 500);
    }
  }
  requestAnimationFrame(animScroll);
}

function showCaseResult(skinKey) {
  const skin = SKINS[skinKey];
  const isNew = !save.ownedSkins.includes(skinKey);
  if (isNew) {
    save.ownedSkins.push(skinKey);
    saveGame();
  }
  
  const result = document.getElementById('caseResult');
  result.innerHTML = `
    <div class="case-result">
      <canvas width="80" height="80" id="resultSkinCanvas"></canvas>
      <div class="res-name">${skin.name}</div>
      <div class="res-rarity ${skin.rarity}">${RARITY_NAMES[skin.rarity]}</div>
      <div style="font-size:11px; margin-top:6px; color:${isNew ? '#00ff88' : '#ffaa00'}">
        ${isNew ? '✨ НОВЫЙ СКИН!' : '🔄 Дубликат (+10 монет)'}
      </div>
    </div>
  `;
  drawSkinOnCanvas(document.getElementById('resultSkinCanvas'), skinKey, 80);
  
  if (!isNew) {
    save.gold += 10;
    saveGame();
    showToast('Дубликат! +10 монет');
  } else {
    showToast('Новый скин получен!');
    vibrate([50, 30, 50, 30, 100]);
  }
  
  document.getElementById('caseBackBtn').style.display = 'block';
}

function initCanvas() {
  canvas = document.getElementById('gameCanvas');
  if (!canvas) return false;
  ctx = canvas.getContext('2d');
  return !!ctx;
}

function resizeCanvas() {
  if (!level || !canvas) return;
  const availW = window.innerWidth - 30;
  const availH = window.innerHeight - 250;
  cellSize = Math.floor(Math.min(availW / level.cols, availH / level.rows));
  if (cellSize < 16) cellSize = 16;
  if (cellSize > 60) cellSize = 60;
  canvas.width = cellSize * level.cols;
  canvas.height = cellSize * level.rows;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  draw();
}

function startGame(key) {
  levelKey = key;
  const cfg = LEVELS[key];
  level = {
    rows: cfg.rows, cols: cfg.cols,
    maze: cfg.maze.map(r => [...r]),
    start: { ...cfg.start },
    finish: { ...cfg.finish },
    coins: cfg.coins.map(c => ({ ...c })),
    spikes: cfg.spikes.map(s => ({ ...s })),
    turrets: cfg.turrets.map(t => ({ ...t }))
  };
  player = { x: level.start.x, y: level.start.y };
  coinsLeft = level.coins.map(c => ({ ...c }));
  moves = 0; coinsCollected = 0; hp = cfg.hp;
  gameWon = false; gameRunning = true;
  projectiles = []; spikeCooldown = 0; animFrame = 0;
  turretTimers = level.turrets.map(t => ({ ...t, timer: Math.random() * t.interval }));
  
  save.stats.gamesPlayed++;
  saveGame();
  updateTopStats();
  
  document.getElementById('overlay').classList.remove('show');
  
  resizeCanvas();
  if (animTimer) cancelAnimationFrame(animTimer);
  lastTime = performance.now();
  animTimer = requestAnimationFrame(gameLoop);
}

function updateTopStats() {
  document.getElementById('levelName').textContent = level ? (LEVELS[levelKey]?.name || '—') : '—';
  document.getElementById('moves').textContent = moves;
  document.getElementById('coins').textContent = level ? `${coinsCollected}/${level.coins.length}` : '0/0';
  document.getElementById('hp').textContent = hp;
  document.getElementById('gold').textContent = save.gold;
}

function gameLoop(now) {
  if (!gameRunning) { animTimer = null; return; }
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  update(dt);
  draw();
  animFrame++;
  animTimer = requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (gameWon) return;
  turretTimers.forEach(t => {
    t.timer += dt;
    if (t.timer >= t.interval) { t.timer = 0; fireProjectile(t); }
  });
  const step = dt / 16;
  projectiles.forEach(p => {
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 6) p.trail.shift();
    p.x += p.vx * step;
    p.y += p.vy * step;
  });
  projectiles = projectiles.filter(p => {
    const cx = Math.floor(p.x), cy = Math.floor(p.y);
    if (cx < 0 || cx >= level.cols || cy < 0 || cy >= level.rows) return false;
    if (level.maze[cy][cx] === 1) return false;
    const ddx = p.x - (player.x + 0.5);
    const ddy = p.y - (player.y + 0.5);
    if (Math.sqrt(ddx*ddx + ddy*ddy) < 0.55) { damagePlayer(); return false; }
    return true;
  });
  if (spikeCooldown > 0) spikeCooldown -= dt;
  if (level.spikes.some(s => s.x === player.x && s.y === player.y) && spikeCooldown <= 0) {
    damagePlayer();
    spikeCooldown = 900;
  }
}

function fireProjectile(turret) {
  let x = turret.x + 0.5, y = turret.y + 0.5;
  const off = 0.6;
  let vx = 0, vy = 0;
  const spd = turret.speed / 60 * 16;
  if (turret.dir === 'right') { x += off; vx = spd; }
  if (turret.dir === 'left') { x -= off; vx = -spd; }
  if (turret.dir === 'down') { y += off; vy = spd; }
  if (turret.dir === 'up') { y -= off; vy = -spd; }
  projectiles.push({ x, y, vx, vy, trail: [] });
}

function damagePlayer() {
  if (gameWon) return;
  hp--;
  document.getElementById('hp').textContent = Math.max(hp, 0);
  const flash = document.getElementById('damageFlash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 150);
  vibrate([80, 40, 80]);
  if (hp <= 0) gameOver();
}

function gameOver() {
  gameRunning = false;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h2>💀 Game Over</h2>
    <p>«${LEVELS[levelKey].name}» · Ходов: ${moves} · NFT: ${coinsCollected}/${level.coins.length}</p>
    <p style="color:#ffd700">Собрано монет: +${coinsCollected}</p>
    <button class="menu-btn ${LEVELS[levelKey].diff}" onclick="startGame('${levelKey}')">🔄 Снова</button>
    <button class="menu-btn" onclick="showLevelSelect()">📋 К уровням</button>
    <button class="menu-btn" onclick="showLobby()">🏠 В лобби</button>
  `;
  document.getElementById('overlay').classList.add('show');
  
  // Монеты в копилку
  addGold(coinsCollected);
}

function winGame() {
  gameWon = true;
  gameRunning = false;
  vibrate([50, 30, 50, 30, 150]);
  const totalScore = Math.max(0, 1000 - moves * 10) + hp * 100;
  const perfect = hp === LEVELS[levelKey].hp;
  const bonusGold = perfect ? 5 : 0;
  const earned = coinsCollected + bonusGold;
  
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h2>🏆 ПОБЕДА!</h2>
    <p>«${LEVELS[levelKey].name}» ${perfect ? '<br><b style="color:#ffd700">🌟 БЕЗ УРОНА!</b>' : ''}</p>
    <p>Ходов: ${moves} · HP: ${hp} · Очки: ${totalScore}</p>
    <p style="color:#ffd700; font-size:16px">🪙 +${earned} монет</p>
    <button class="menu-btn" onclick="showLevelSelect()">📋 К уровням</button>
    <button class="menu-btn" onclick="showLobby()">🏠 В лобби</button>
  `;
  document.getElementById('overlay').classList.add('show');
  
  addGold(earned);
  vibrate([100, 50, 100]);
}

function addGold(amount) {
  save.gold += amount;
  save.stats.totalCoins += amount;
  saveGame();
  updateTopStats();
}

// ================================================================
// ОТРИСОВКА ИГРЫ
// ================================================================
function draw() {
  if (!level || !ctx || !canvas) return;
  try {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a0015';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const t = animFrame;
    
    for (let y = 0; y < level.rows; y++) {
      for (let x = 0; x < level.cols; x++) {
        const px = x * cellSize, py = y * cellSize;
        if (level.maze[y][x] === 1) {
          const g = ctx.createLinearGradient(px, py, px + cellSize, py + cellSize);
          g.addColorStop(0, '#5a2a90');
          g.addColorStop(0.5, '#3a1560');
          g.addColorStop(1, '#4a2075');
          ctx.fillStyle = g;
          ctx.fillRect(px, py, cellSize, cellSize);
          ctx.strokeStyle = 'rgba(180, 0, 255, 0.8)';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
          ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
          ctx.fillRect(px, py, cellSize, 2);
        } else {
          ctx.fillStyle = '#1a0535';
          ctx.fillRect(px, py, cellSize, cellSize);
          ctx.strokeStyle = 'rgba(120, 0, 220, 0.2)';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
        }
      }
    }
    
    level.spikes.forEach(s => {
      const cx = s.x * cellSize + cellSize / 2;
      const cy = s.y * cellSize + cellSize / 2;
      const r = cellSize * 0.35;
      const sp = 0.5 + Math.abs(Math.sin(t * 0.06)) * 0.5;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.8);
      glow.addColorStop(0, `rgba(255, 40, 40, ${0.4 + sp * 0.4})`);
      glow.addColorStop(1, 'rgba(255, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff3355';
      ctx.strokeStyle = '#ff6688';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        const len = r * (0.7 + sp * 0.3);
        const tx = cx + Math.cos(a) * len;
        const ty = cy + Math.sin(a) * len;
        const p = a + Math.PI / 2;
        const br = r * 0.35;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(cx + Math.cos(p) * br, cy + Math.sin(p) * br);
        ctx.lineTo(cx - Math.cos(p) * br, cy - Math.sin(p) * br);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#880022';
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.22, 0, Math.PI * 2); ctx.fill();
    });
    
    turretTimers.forEach(tu => {
      const cx = tu.x * cellSize + cellSize / 2;
      const cy = tu.y * cellSize + cellSize / 2;
      const colors = {
        right:['#00ffcc','#0088aa'], left:['#00ffcc','#0088aa'],
        up:['#ff00aa','#880066'], down:['#ff00aa','#880066']
      };
      const [c1, c2] = colors[tu.dir] || ['#ff4444','#880022'];
      const g = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, cellSize * 0.4);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, cellSize * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = c1; ctx.lineWidth = 1.5; ctx.stroke();
      const angles = { right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2 };
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angles[tu.dir]);
      ctx.fillStyle = '#001122';
      ctx.fillRect(0, -cellSize * 0.08, cellSize * 0.42, cellSize * 0.16);
      ctx.fillStyle = c1;
      ctx.fillRect(cellSize * 0.28, -cellSize * 0.1, cellSize * 0.14, cellSize * 0.2);
      ctx.restore();
      const charge = tu.timer / tu.interval;
      ctx.strokeStyle = charge > 0.85 ? '#ff0000' : '#ffaa00';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(cx, cy, cellSize * 0.46, -Math.PI/2, -Math.PI/2 + charge * Math.PI * 2);
      ctx.stroke();
    });
    
    coinsLeft.forEach((coin, i) => {
      const px = coin.x * cellSize + cellSize / 2;
      const py = coin.y * cellSize + cellSize / 2;
      const pulse = 1 + Math.sin(t * 0.08 + i) * 0.15;
      const r = cellSize * 0.28 * pulse;
      const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 2.5);
      glow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
      glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(px, py, r * 2.5, 0, Math.PI * 2); ctx.fill();
      const grad = ctx.createRadialGradient(px - r/3, py - r/3, 0, px, py, r);
      grad.addColorStop(0, '#fff700');
      grad.addColorStop(0.6, '#ffaa00');
      grad.addColorStop(1, '#ff6600');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(px - r/3, py - r/3, r/4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a2a00';
      ctx.font = `bold ${Math.max(10, r * 1.1)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('◈', px, py + 1);
    });
    
    const fx = level.finish.x * cellSize + cellSize / 2;
    const fy = level.finish.y * cellSize + cellSize / 2;
    const fp = 1 + Math.sin(t * 0.08) * 0.2;
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, cellSize * 0.6 * fp);
    fg.addColorStop(0, 'rgba(0, 255, 150, 0.8)');
    fg.addColorStop(1, 'rgba(0, 255, 150, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fx, fy, cellSize * 0.6 * fp, 0, Math.PI * 2); ctx.fill();
    ctx.font = `bold ${Math.max(14, cellSize * 0.55)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00ff99';
    ctx.fillText('★', fx, fy);
    
    projectiles.forEach(p => {
      p.trail.forEach((pt, i) => {
        const a = (i + 1) / p.trail.length;
        ctx.fillStyle = `rgba(255, ${Math.floor(80 + a * 100)}, 0, ${a * 0.6})`;
        ctx.beginPath();
        ctx.arc(pt.x * cellSize, pt.y * cellSize, cellSize * 0.08 * a, 0, Math.PI * 2);
        ctx.fill();
      });
      const sx = p.x * cellSize, sy = p.y * cellSize, r = cellSize * 0.14;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 2);
      g.addColorStop(0, '#ffff00');
      g.addColorStop(0.5, '#ff6600');
      g.addColorStop(1, 'rgba(255, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, r * 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffff88';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    });
    
    // Игрок со скином
    const skin = SKINS[save.equippedSkin] || SKINS.blue;
    const pxx = player.x * cellSize + cellSize / 2;
    const pyy = player.y * cellSize + cellSize / 2;
    const pR = cellSize * 0.32;
    const lowHP = hp === 1;
    if (lowHP && Math.floor(t / 8) % 2 === 0) ctx.globalAlpha = 0.6;
    const pGlow = ctx.createRadialGradient(pxx, pyy, 0, pxx, pyy, pR * 2.5);
    pGlow.addColorStop(0, lowHP ? 'rgba(255,80,80,0.7)' : skin.glow);
    pGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pGlow;
    ctx.beginPath(); ctx.arc(pxx, pyy, pR * 2.5, 0, Math.PI * 2); ctx.fill();
    const pGrad = ctx.createRadialGradient(pxx - pR/3, pyy - pR/3, 0, pxx, pyy, pR);
    if (lowHP) {
      pGrad.addColorStop(0, '#ffaaaa');
      pGrad.addColorStop(0.5, '#ff4466');
      pGrad.addColorStop(1, '#aa0022');
    } else {
      pGrad.addColorStop(0, skin.colors[0]);
      pGrad.addColorStop(0.5, skin.colors[1]);
      pGrad.addColorStop(1, skin.colors[2]);
    }
    ctx.fillStyle = pGrad;
    ctx.beginPath(); ctx.arc(pxx, pyy, pR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#001a33';
    const eyeR = pR * 0.18;
    ctx.beginPath();
    ctx.arc(pxx - pR * 0.3, pyy - pR * 0.1, eyeR, 0, Math.PI * 2);
    ctx.arc(pxx + pR * 0.3, pyy - pR * 0.1, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(pxx - pR * 0.25, pyy - pR * 0.15, eyeR * 0.4, 0, Math.PI * 2);
    ctx.arc(pxx + pR * 0.35, pyy - pR * 0.15, eyeR * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#001a33';
    ctx.lineWidth = Math.max(1.5, pR * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (lowHP) ctx.arc(pxx, pyy + pR * 0.55, pR * 0.35, 1.15 * Math.PI, 1.85 * Math.PI);
    else ctx.arc(pxx, pyy + pR * 0.15, pR * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } catch (e) {
    debug('draw error: ' + e.message);
  }
}

// ================================================================
// ДВИЖЕНИЕ
// ================================================================
function move(dx, dy) {
  if (!gameRunning || gameWon || !level) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || nx >= level.cols || ny < 0 || ny >= level.rows) return;
  if (level.maze[ny][nx] === 1) return;
  player.x = nx; player.y = ny;
  moves++;
  document.getElementById('moves').textContent = moves;
  const coinIdx = coinsLeft.findIndex(c => c.x === nx && c.y === ny);
  if (coinIdx !== -1) {
    coinsLeft.splice(coinIdx, 1);
    coinsCollected++;
    document.getElementById('coins').textContent = coinsCollected + '/' + level.coins.length;
    vibrate(25);
  }
  if (nx === level.finish.x && ny === level.finish.y) {
    if (coinsCollected === level.coins.length) winGame();
    else showToast(`Нужны все NFT: ${coinsCollected}/${level.coins.length}`);
  }
}

function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch(e){} }

// ================================================================
// УПРАВЛЕНИЕ
// ================================================================
function bindControls() {
  const dirs = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  document.querySelectorAll('.btn').forEach(btn => {
    const handler = (e) => {
      e.preventDefault();
      const d = dirs[btn.dataset.dir];
      if (d) move(d[0], d[1]);
    };
    btn.addEventListener('touchstart', handler, { passive:false });
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); handler(e); });
  });
  let ts = null;
  canvas.addEventListener('touchstart', (e) => {
    ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!ts) return;
    const dx = e.changedTouches[0].clientX - ts.x;
    const dy = e.changedTouches[0].clientY - ts.y;
    ts = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else move(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
      w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
      W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
    };
    const k = map[e.key];
    if (k) { e.preventDefault(); move(k[0], k[1]); }
  });
}

// ================================================================
// ЗАПУСК
// ================================================================
(function boot() {
  // Демо-лабиринт на фоне, чтобы не было чёрного экрана
  const cfg = LEVELS.easy1;
  level = {
    rows: cfg.rows, cols: cfg.cols,
    maze: cfg.maze.map(r => [...r]),
    start: { ...cfg.start },
    finish: { ...cfg.finish },
    coins: cfg.coins.map(c => ({ ...c })),
    spikes: cfg.spikes.map(s => ({ ...s })),
    turrets: []
  };
  player = { x: level.start.x, y: level.start.y };
  coinsLeft = level.coins.map(c => ({ ...c }));
  
  initCanvas();
  resizeCanvas();
  updateTopStats();
  bindControls();
  
  // Показываем лобби
  showLobby();
  
  // Анимация на фоне (для красоты)
  gameRunning = true;
  lastTime = performance.now();
  animTimer = requestAnimationFrame(gameLoop);
})();

window.addEventListener('resize', () => { if (level && canvas) resizeCanvas(); });
</script>
